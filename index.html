<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Notepad</title>

  <!-- PWA & Mobil Ana Ekran Meta Etiketleri -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Notepad" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta id="theme-color-meta" name="theme-color" content="#f6f4ef" />

  <!-- Dinamik Canvas PNG İkon ve PWA Manifest Bağlantıları -->
  <link id="favicon-link" rel="icon" type="image/png" href="" />
  <link id="apple-touch-icon-link" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="manifest-link" rel="manifest" href="" />

  <!-- Google Fonts: Arayüz fontu (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-board: #f6f4ef;
      --dot-color: #D8D3C8;
      --accent-orange: #F6A97A;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    /* Karanlık Mod Değişkenleri */
    body.dark-mode {
      --bg-board: #121215;
      --dot-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-board);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    /* Sonsuz Noktalı Pano Arka Planı */
    #board-viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-board);
      background-image: radial-gradient(circle, var(--dot-color) 1.35px, transparent 1.35px);
      background-size: 26px 26px;
      background-position: 0px 0px;
      cursor: grab;
      touch-action: none;
    }

    #board-viewport.is-panning {
      cursor: grabbing;
    }

    /* Pan & Zoom Dönüşüm Katmanı */
    #board-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* Gerçekçi Post-It Kartı */
    .postit {
      position: absolute;
      width: 220px;
      height: 220px;
      min-width: 160px;
      min-height: 160px;
      border-radius: 2px 2px 4px 2px;
      padding: 30px 18px 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      touch-action: none;
      transform-origin: center center;
      transition: box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      /* Üst yapışkan şerit + kağıt ışık gradyanı */
      background-image:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.06) 0px,
          rgba(0, 0, 0, 0.032) 24px,
          rgba(255, 255, 255, 0.16) 25px,
          rgba(255, 255, 255, 0) 68%,
          rgba(0, 0, 0, 0.035) 100%
        );
      box-shadow:
        0 2px 4px rgba(45, 38, 28, 0.07),
        0 6px 14px rgba(45, 38, 28, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      will-change: transform, left, top, width, height;
    }

    /* Sağ Alt Köşe Boyutlandırma Tutamacı */
    .postit-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 28px;
      height: 28px;
      cursor: nwse-resize;
      touch-action: none;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 5px;
      color: rgba(35, 32, 28, 0.34);
      transition: color 0.15s ease, transform 0.15s ease;
      z-index: 4;
    }

    .postit:hover .postit-resize-handle,
    .postit.is-focused .postit-resize-handle,
    .postit.is-resizing .postit-resize-handle {
      color: rgba(35, 32, 28, 0.72);
    }

    .postit.is-resizing {
      cursor: nwse-resize;
      box-shadow:
        0 14px 30px rgba(45, 38, 28, 0.16),
        0 6px 14px rgba(45, 38, 28, 0.1);
    }

    /* Odaklı Notta Inline Font Boyutu Kontrolü */
    .postit-font-controls {
      display: none;
      align-items: center;
      gap: 2px;
      background: rgba(35, 32, 28, 0.09);
      border-radius: 999px;
      padding: 2px 4px;
    }

    .postit.is-focused .postit-font-controls {
      display: inline-flex;
    }

    .postit-font-btn {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #23201C;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .postit-font-btn:hover {
      background: rgba(35, 32, 28, 0.12);
    }

    .postit-font-val {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      color: #23201C;
      min-width: 18px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Alt-sağ köşe kıvrık kağıt gölgesi */
    .postit::before {
      content: '';
      position: absolute;
      z-index: -1;
      bottom: 8px;
      right: 5px;
      width: 68%;
      height: 26px;
      background: rgba(34, 28, 18, 0.22);
      transform: rotate(3.4deg) skewX(6deg);
      filter: blur(7px);
      border-radius: 2px;
      transition: all 0.25s ease;
      pointer-events: none;
    }

    /* Alt-sol denge gölgesi */
    .postit::after {
      content: '';
      position: absolute;
      z-index: -1;
      bottom: 6px;
      left: 10px;
      width: 44%;
      height: 14px;
      background: rgba(34, 28, 18, 0.09);
      transform: rotate(-1.5deg);
      filter: blur(6px);
      pointer-events: none;
    }

    .postit:hover {
      box-shadow:
        0 4px 10px rgba(45, 38, 28, 0.1),
        0 10px 22px rgba(45, 38, 28, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .postit.is-dragging {
      cursor: grabbing;
      box-shadow:
        0 16px 32px rgba(45, 38, 28, 0.18),
        0 6px 14px rgba(45, 38, 28, 0.1);
    }

    .postit.is-dragging::before {
      bottom: 2px;
      right: 4px;
      filter: blur(11px);
      opacity: 0.32;
    }

    .postit.is-focused {
      box-shadow:
        0 18px 42px rgba(38, 30, 20, 0.18),
        0 6px 16px rgba(38, 30, 20, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .postit.is-focused::before {
      bottom: 4px;
      right: 4px;
      height: 30px;
      filter: blur(11px);
      background: rgba(34, 28, 18, 0.25);
    }

    /* Notun İçindeki Yazı: Düz ve Okunaklı Sans-Serif (Arial) */
    .postit-text {
      font-family: Arial, Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.42;
      letter-spacing: 0;
      color: #22201d;
      word-break: break-word;
      white-space: pre-wrap;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: none;
      -ms-overflow-style: none;
      outline: none;
    }

    .postit-text::-webkit-scrollbar {
      display: none;
    }

    .postit.is-focused .postit-text {
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    /* Doğrudan Düzenleme Textarea'sı */
    .postit-edit-area {
      font-family: Arial, Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.42;
      letter-spacing: 0;
      color: #22201d;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      flex: 1;
      padding: 0;
      margin: 0;
      scrollbar-width: none;
    }

    .postit-edit-area::-webkit-scrollbar {
      display: none;
    }

    /* Her Notun Altındaki Tamamlandı Butonu */
    .postit-actions {
      margin-top: 8px;
      padding-right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      opacity: 0.6;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .postit:hover .postit-actions,
    .postit.is-focused .postit-actions {
      opacity: 1;
    }

    .btn-complete {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(35, 32, 28, 0.84);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .btn-complete:hover {
      background: #171512;
      transform: scale(1.04);
    }

    .btn-complete:active {
      transform: scale(0.95);
    }

    /* Silinme (Panodan Sökülüp Uçma) Animasyonu */
    .postit.is-peeling {
      pointer-events: none;
      animation: peelOff 0.4s cubic-bezier(0.32, 0, 0.67, 0) forwards;
    }

    @keyframes peelOff {
      0% {
        opacity: 1;
        transform: rotate(var(--note-rot, 0deg)) scale(1) translateY(0);
      }
      30% {
        opacity: 0.95;
        transform: rotate(calc(var(--note-rot, 0deg) - 4deg)) scale(1.05) translateY(-8px);
      }
      100% {
        opacity: 0;
        transform: rotate(calc(var(--note-rot, 0deg) + 12deg)) scale(0.82) translateY(-68px);
      }
    }

    /* Yeni Not Yapışma Animasyonu */
    .postit.is-popping {
      animation: stickOn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes stickOn {
      0% {
        opacity: 0;
        transform: rotate(var(--note-rot, 0deg)) scale(1.15) translateY(-14px);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--note-rot, 0deg)) scale(1) translateY(0);
      }
    }

    /* Yüzen Glassmorphism (Buzlu Cam) Kontroller */
    .floating-pill {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(45, 38, 28, 0.08);
      box-shadow: 0 4px 16px rgba(45, 38, 28, 0.07), 0 1px 3px rgba(45, 38, 28, 0.04);
    }

    /* Yeni Not Modalındaki Gerçekçi Post-It Kartı */
    .modal-postit {
      position: relative;
      border-radius: 4px;
      background-image:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.06) 0px,
          rgba(0, 0, 0, 0.03) 28px,
          rgba(255, 255, 255, 0.16) 29px,
          rgba(255, 255, 255, 0) 66%,
          rgba(0, 0, 0, 0.03) 100%
        );
      box-shadow:
        0 22px 54px rgba(34, 28, 20, 0.22),
        0 6px 18px rgba(34, 28, 20, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: background-color 0.22s ease;
    }

    .modal-postit::before {
      content: '';
      position: absolute;
      z-index: -1;
      bottom: 8px;
      right: 10px;
      width: 65%;
      height: 24px;
      background: rgba(30, 24, 16, 0.24);
      transform: rotate(2.4deg);
      filter: blur(10px);
      pointer-events: none;
    }

    .modal-textarea {
      font-family: Arial, Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 17px;
      line-height: 1.45;
      letter-spacing: 0;
      color: #22201d;
    }

    /* Modal Sayısal Giriş Oklarını Gizle */
    .no-spinner::-webkit-inner-spin-button,
    .no-spinner::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .no-spinner {
      -moz-appearance: textfield;
    }

    /* 16 Renklik Seçici Daireler */
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid rgba(35, 32, 28, 0.12);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .color-swatch:hover {
      transform: scale(1.14);
    }

    .color-swatch.is-selected {
      transform: scale(1.16);
      border-color: #23201C;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 3px 8px rgba(0, 0, 0, 0.16);
    }

    /* Üst Toast Bildirimi */
    #toast {
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #toast.is-hidden {
      opacity: 0;
      transform: translate(-50%, -14px);
      pointer-events: none;
    }

    #toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    /* Karanlık Mod Arayüz Stilleri */
    body.dark-mode .floating-pill {
      background: rgba(28, 28, 32, 0.88);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
      color: #F4F4F5;
    }

    body.dark-mode #note-count {
      color: #F4F4F5;
    }

    body.dark-mode #btn-bell,
    body.dark-mode #btn-theme,
    body.dark-mode #btn-zoom-out,
    body.dark-mode #btn-reset-view,
    body.dark-mode #btn-zoom-in {
      color: #E4E4E7;
    }

    body.dark-mode #btn-bell:hover,
    body.dark-mode #btn-theme:hover {
      color: #FFFFFF;
    }

    body.dark-mode #btn-zoom-out:hover,
    body.dark-mode #btn-reset-view:hover,
    body.dark-mode #btn-zoom-in:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
    }

    body.dark-mode #bell-dot {
      --tw-ring-color: #1c1c20;
    }

    body.dark-mode .postit {
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.42),
        0 12px 26px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    body.dark-mode .postit::before {
      background: rgba(0, 0, 0, 0.58);
    }

    body.dark-mode .postit::after {
      background: rgba(0, 0, 0, 0.34);
    }

    body.dark-mode .postit.is-focused {
      box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.62),
        0 8px 20px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    body.dark-mode #add-modal {
      background-color: rgba(10, 10, 13, 0.72);
    }

    body.dark-mode .modal-shell {
      background: rgba(28, 28, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    body.dark-mode #toast {
      background-color: rgba(28, 28, 32, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F4F4F5;
    }
  </style>
</head>
<body>

  <!-- Tam Ekran Etkileşimli Post-It Panosu -->
  <main id="board-viewport" aria-label="Not Panosu">
    <div id="board-world"></div>
  </main>

  <!-- Sol Üst: Uygulama İkonu ve Not Sayacı -->
  <header
    class="fixed z-30 flex items-center gap-2.5 pl-2 pr-3.5 py-1.5 rounded-full floating-pill"
    style="top: calc(16px + var(--safe-top)); left: calc(16px + var(--safe-left));"
  >
    <div
      class="w-7 h-7 rounded-lg bg-white flex items-center justify-center shadow-sm border border-black/5 shrink-0"
      aria-hidden="true"
    >
      <span class="w-3.5 h-3.5 rounded-full block" style="background-color: #F6A97A;"></span>
    </div>
    <span id="note-count" class="text-sm font-medium text-[#2A2622] tracking-tight tabular-nums">
      0 not
    </span>
  </header>

  <!-- Sağ Üst: Karanlık Mod, Saatlik Bildirim Zili & + Yeni Not Butonu -->
  <div
    class="fixed z-30 flex items-center gap-2.5"
    style="top: calc(16px + var(--safe-top)); right: calc(16px + var(--safe-right));"
  >
    <!-- Karanlık Mod Geçiş Butonu -->
    <button
      id="btn-theme"
      type="button"
      aria-label="Karanlık Mod"
      title="Karanlık Mod"
      class="w-11 h-11 rounded-full floating-pill flex items-center justify-center text-[#4A453F] hover:text-[#23201C] active:scale-95 transition-all"
    >
      <!-- Ay İkonu (Açık modda görünür) -->
      <svg id="icon-moon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <!-- Güneş İkonu (Karanlık modda görünür) -->
      <svg id="icon-sun" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="m4.93 4.93 1.41 1.41" />
        <path d="m17.66 17.66 1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="m6.34 17.66-1.41 1.41" />
        <path d="m19.07 4.93-1.41 1.41" />
      </svg>
    </button>

    <!-- Saatlik Bildirim Zili -->
    <button
      id="btn-bell"
      type="button"
      aria-label="Saatlik Bildirim"
      title="Saatlik Bildirim"
      class="relative w-11 h-11 rounded-full floating-pill flex items-center justify-center text-[#4A453F] hover:text-[#23201C] active:scale-95 transition-all"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
      <span
        id="bell-dot"
        class="hidden absolute top-2.5 right-2.5 w-2.5 h-2.5 rounded-full ring-2 ring-white"
        style="background-color: #F6A97A;"
      ></span>
    </button>

    <!-- + Yeni Not Butonu -->
    <button
      id="btn-add-note"
      type="button"
      aria-label="Yeni Not Ekle"
      class="h-11 px-4 rounded-full flex items-center gap-1.5 text-white text-sm font-medium shadow-md hover:brightness-95 active:scale-95 transition-all"
      style="background-color: #F6A97A; box-shadow: 0 6px 18px rgba(246, 169, 122, 0.42), 0 2px 5px rgba(45, 38, 28, 0.08);"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span>Yeni Not</span>
    </button>
  </div>

  <!-- Üst Toast Bildirim Mesajı -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="is-hidden fixed left-1/2 z-50 px-4 py-2.5 rounded-full bg-[#23201C]/92 text-white text-xs sm:text-sm font-medium shadow-lg backdrop-blur-md whitespace-nowrap max-w-[90vw] truncate"
    style="top: calc(74px + var(--safe-top));"
  ></div>

  <!-- Sağ Alt: Minimal Yüzen Zoom Kontrolleri (- / Ortala / +) -->
  <div
    class="fixed z-30 floating-pill rounded-full flex items-center p-1 gap-0.5"
    style="bottom: calc(20px + var(--safe-bottom)); right: calc(16px + var(--safe-right));"
  >
    <button
      id="btn-zoom-out"
      type="button"
      aria-label="Uzaklaştır"
      title="Uzaklaştır"
      class="w-9 h-9 rounded-full flex items-center justify-center text-[#3D3832] hover:bg-black/5 active:scale-95 transition"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>

    <button
      id="btn-reset-view"
      type="button"
      aria-label="Panoyu Ortala"
      title="Panoyu Ortala"
      class="px-2.5 h-9 rounded-full flex items-center justify-center text-xs font-medium text-[#4F4942] hover:bg-black/5 active:scale-95 transition"
    >
      Ortala
    </button>

    <button
      id="btn-zoom-in"

  <script>
    (function () {
      'use strict';

      /* =========================================================
         1. SABİTLER VE 16 POST-IT KAĞIT RENGİ
      ========================================================= */
      const STORAGE_KEYS = {
        NOTES: 'notpanom_notes_v2',
        INIT: 'notpanom_initialized_v2',
        HOURLY_ENABLED: 'notpanom_hourly_enabled_v2',
        LAST_NOTIFIED_HOUR: 'notpanom_last_notified_hour_v2',
        LAST_COLOR: 'notpanom_last_color_v2',
        LAST_FONT_SIZE: 'notepad_last_font_size_v1',
        DARK_MODE: 'notepad_dark_mode_v1'
      };

      const NOTE_SIZE = 220;
      const MIN_NOTE_SIZE = 160;
      const MAX_NOTE_SIZE = 520;
      const MIN_FONT_SIZE = 12;
      const MAX_FONT_SIZE = 42;
      const DEFAULT_FONT_SIZE = 16;
      const MAX_SCALE = 2.2;
      const DOT_BASE_SPACING = 26;

      const POSTIT_COLORS = [
        { name: 'Klasik Sarı', hex: '#FFF3A1' },
        { name: 'Krem', hex: '#FFF9DB' },
        { name: 'Pastel Turuncu', hex: '#FFD0A6' },
        { name: 'Şeftali', hex: '#FFDFC4' },
        { name: 'Mercan', hex: '#FFB8A8' },
        { name: 'Pastel Pembe', hex: '#FFC8DD' },
        { name: 'Gül Kurusu', hex: '#F4C2C2' },
        { name: 'Lavanta', hex: '#E0D4FC' },
        { name: 'Leylak', hex: '#EFD6FF' },
        { name: 'Buz Mavisi', hex: '#D4F0FF' },
        { name: 'Gökyüzü Mavisi', hex: '#BFE3FF' },
        { name: 'Turkuaz', hex: '#C4F4EC' },
        { name: 'Nane Yeşili', hex: '#CCF5D8' },
        { name: 'Fıstık Yeşili', hex: '#E2F5B8' },
        { name: 'Adaçayı Yeşili', hex: '#D4E6C3' },
        { name: 'Kraft', hex: '#E8D5B7' }
      ];

      /* =========================================================
         2. UYGULAMA DURUMU (STATE)
      ========================================================= */
      let notes = [];
      let selectedColor = localStorage.getItem(STORAGE_KEYS.LAST_COLOR) || POSTIT_COLORS[0].hex;
      let selectedFontSize = clampNumber(
        parseInt(localStorage.getItem(STORAGE_KEYS.LAST_FONT_SIZE), 10) || DEFAULT_FONT_SIZE,
        MIN_FONT_SIZE,
        MAX_FONT_SIZE
      );
      let focusedNoteId = null;
      let highestZIndex = 10;

      const camera = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        scale: window.innerWidth < 640 ? 0.85 : 1.0
      };

      let animFrameId = null;
      let toastTimeoutId = null;
      let hourlyEnabled = localStorage.getItem(STORAGE_KEYS.HOURLY_ENABLED) === 'true';
      let isDarkMode = localStorage.getItem(STORAGE_KEYS.DARK_MODE) === 'true';
      let appIconDataUrl = '';

      /* =========================================================
         3. DOM REFERANSLARI
      ========================================================= */
      const viewportEl = document.getElementById('board-viewport');
      const worldEl = document.getElementById('board-world');
      const noteCountEl = document.getElementById('note-count');
      const btnTheme = document.getElementById('btn-theme');
      const iconMoon = document.getElementById('icon-moon');
      const iconSun = document.getElementById('icon-sun');
      const themeColorMeta = document.getElementById('theme-color-meta');
      const btnBell = document.getElementById('btn-bell');
      const bellDot = document.getElementById('bell-dot');
      const toastEl = document.getElementById('toast');

      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnResetView = document.getElementById('btn-reset-view');
      const btnAddNote = document.getElementById('btn-add-note');

      const addModal = document.getElementById('add-modal');
      const modalCard = document.getElementById('modal-card');
      const btnCloseModal = document.getElementById('btn-close-modal');
      const newNoteInput = document.getElementById('new-note-input');
      const newNoteFontSizeInput = document.getElementById('new-note-fontsize');
      const btnFontDec = document.getElementById('btn-font-dec');
      const btnFontInc = document.getElementById('btn-font-inc');
      const colorPickerEl = document.getElementById('color-picker');
      const btnSaveNote = document.getElementById('btn-save-note');

      /* =========================================================
         4. PWA İKONU (CANVAS PNG) VE DİNAMİK MANİFEST
         Beyaz zemin (#FFFFFF) + ortada %50 çaplı pastel turuncu (#F6A97A) daire
      ========================================================= */
      function generateIconDataUrl(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, size, size);

        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = '#F6A97A';
        ctx.fill();

        return canvas.toDataURL('image/png');
      }

      function setupPwaAssets() {
        try {
          const icon180 = generateIconDataUrl(180);
          const icon192 = generateIconDataUrl(192);
          const icon512 = generateIconDataUrl(512);
          appIconDataUrl = icon192;

          document.getElementById('apple-touch-icon-link').href = icon180;
          document.getElementById('favicon-link').href = icon192;

          const manifestObj = {
            name: 'Notepad',
            short_name: 'Notepad',
            description: 'Gerçekçi post-it not panosu',
            start_url: '.',
            display: 'standalone',
            background_color: '#f6f4ef',
            theme_color: '#f6f4ef',
            icons: [
              { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };

          const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
          document.getElementById('manifest-link').href = URL.createObjectURL(blob);
        } catch (err) {
          console.error('PWA varlıkları oluşturulamadı:', err);
        }
      }

      /* =========================================================
         4B. KARANLIK MOD YÖNETİMİ
      ========================================================= */
      function applyTheme(dark) {
        isDarkMode = dark;
        document.body.classList.toggle('dark-mode', dark);

        if (dark) {
          iconMoon.classList.add('hidden');
          iconSun.classList.remove('hidden');
          btnTheme.setAttribute('aria-label', 'Açık Mod');
          btnTheme.setAttribute('title', 'Açık Mod');
          themeColorMeta.setAttribute('content', '#121215');
        } else {
          iconSun.classList.add('hidden');
          iconMoon.classList.remove('hidden');
          btnTheme.setAttribute('aria-label', 'Karanlık Mod');
          btnTheme.setAttribute('title', 'Karanlık Mod');
          themeColorMeta.setAttribute('content', '#f6f4ef');
        }

        updateBellUI();
      }

      function toggleTheme() {
        const next = !isDarkMode;
        localStorage.setItem(STORAGE_KEYS.DARK_MODE, String(next));
        applyTheme(next);
      }

      btnTheme.addEventListener('click', toggleTheme);

      /* =========================================================
         5. YARDIMCI FONKSİYONLAR (ID, EĞİM, TOAST, ÖLÇÜ)
      ========================================================= */
      function clampNumber(val, min, max) {
        if (!Number.isFinite(val)) return min;
        return Math.max(min, Math.min(max, val));
      }

      function getNoteDims(note) {
        return {
          w: clampNumber(note && note.width ? note.width : NOTE_SIZE, MIN_NOTE_SIZE, MAX_NOTE_SIZE),
          h: clampNumber(note && note.height ? note.height : NOTE_SIZE, MIN_NOTE_SIZE, MAX_NOTE_SIZE)
        };
      }

      function createId() {
        return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function randomRotation() {
        return Number(((Math.random() * 5) - 2.5).toFixed(2));
      }

      function showToast(message, duration = 2600) {
        toastEl.textContent = message;
        toastEl.classList.remove('is-hidden');
        toastEl.classList.add('is-visible');

        if (toastTimeoutId) clearTimeout(toastTimeoutId);
        toastTimeoutId = setTimeout(() => {
          toastEl.classList.remove('is-visible');
          toastEl.classList.add('is-hidden');
        }, duration);
      }

      /* =========================================================
         6. NOTLARI YÜKLEME VE KAYDETME (LOCALSTORAGE)
      ========================================================= */
      function loadNotes() {
        try {
          const isInitialized = localStorage.getItem(STORAGE_KEYS.INIT);
          const raw = localStorage.getItem(STORAGE_KEYS.NOTES);

          if (!isInitialized && !raw) {
            notes = [
              {
                id: createId(),
                text: 'Bana tıkla, ekranın ortasına geleyim!',
                color: '#FFF3A1',
                x: -255,
                y: -125,
                rotation: -2.1,
                z: 1,
                createdAt: Date.now()
              },
              {
                id: createId(),
                text: 'İki parmakla ya da +/- ile yakınlaştırabilirsin.',
                color: '#FFD0A6',
                x: 20,
                y: -145,
                rotation: 1.8,
                z: 2,
                createdAt: Date.now() + 1
              },
              {
                id: createId(),
                text: 'İşin bitince Tamamlandı\'ya bas, panodan silineyim.',
                color: '#CCF5D8',
                x: -115,
                y: 120,
                rotation: -1.4,
                z: 3,
                createdAt: Date.now() + 2
              }
            ];
            localStorage.setItem(STORAGE_KEYS.INIT, '1');
            saveNotes();
          } else if (raw) {
            notes = JSON.parse(raw) || [];
          } else {
            notes = [];
          }

          // Önceden çok uzağa bırakılmış veya geçersiz konumlu notları kompakt pano içine topla
          let needsClampSave = false;
          notes.forEach((n) => {
            const dims = getNoteDims(n);
            n.width = dims.w;
            n.height = dims.h;
            n.fontSize = clampNumber(n.fontSize || DEFAULT_FONT_SIZE, MIN_FONT_SIZE, MAX_FONT_SIZE);

            const safeX = Number.isFinite(n.x) ? n.x : -dims.w / 2;
            const safeY = Number.isFinite(n.y) ? n.y : -dims.h / 2;
            const clamped = clampNoteCoords(safeX, safeY, dims.w, dims.h);
            if (clamped.x !== n.x || clamped.y !== n.y) {
              n.x = clamped.x;
              n.y = clamped.y;
              needsClampSave = true;
            }
          });
          if (needsClampSave) {
            saveNotes();
          }

          highestZIndex = notes.reduce((max, n) => Math.max(max, n.z || 1), 10);
        } catch (err) {
          console.error('Notlar yüklenemedi:', err);
          notes = [];
        }
      }

      function saveNotes() {
        try {
          localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(notes));
        } catch (err) {
          console.error('Notlar kaydedilemedi:', err);
        }
        updateNoteCounter();
      }

      function updateNoteCounter() {
        noteCountEl.textContent = `${notes.length} not`;
      }

      /* =========================================================
         7. KAMERA (PAN & ZOOM) DÖNÜŞÜMÜ VE YUMUŞAK ANİMASYON
      ========================================================= */
      function getBoardMetrics() {
        const vw = Math.max(320, window.innerWidth);
        const vh = Math.max(320, window.innerHeight);
        // Ekran en-boy oranıyla birebir aynı, kompakt pano boyutu
        const factor = Math.max(960 / vw, 960 / vh, 1.5);
        const worldW = Math.round(vw * factor);
        const worldH = Math.round(vh * factor);
        const halfW = worldW / 2;
        const halfH = worldH / 2;
        const pad = 72;

        return {
          worldW,
          worldH,
          minX: -halfW,
          maxX: halfW,
          minY: -halfH,
          maxY: halfH,
          noteMinX: -halfW + pad,
          noteMaxX: halfW - pad - NOTE_SIZE,
          noteMinY: -halfH + pad,
          noteMaxY: halfH - pad - NOTE_SIZE
        };
      }

      // Ekranın pano sınırlarının dışını asla göstermemesi için dinamik minimum ölçek
      function getMinScale() {
        const m = getBoardMetrics();
        return Math.max(window.innerWidth / m.worldW, window.innerHeight / m.worldH);
      }

      // Kamerayı pano kenarlarına kilitle (dışarıdaki boşluk hiç görünmez)
      function clampCameraPosition(x, y, scale) {
        const m = getBoardMetrics();
        const minX = window.innerWidth - m.maxX * scale;
        const maxX = -m.minX * scale;
        const minY = window.innerHeight - m.maxY * scale;
        const maxY = -m.minY * scale;

        return {
          x: minX > maxX ? (minX + maxX) / 2 : Math.max(minX, Math.min(maxX, x)),
          y: minY > maxY ? (minY + maxY) / 2 : Math.max(minY, Math.min(maxY, y))
        };
      }

      function applyCameraTransform() {
        camera.scale = Math.max(getMinScale(), Math.min(MAX_SCALE, camera.scale));
        const clamped = clampCameraPosition(camera.x, camera.y, camera.scale);
        camera.x = clamped.x;
        camera.y = clamped.y;

        worldEl.style.transform = `translate3d(${camera.x}px, ${camera.y}px, 0) scale(${camera.scale})`;

        const spacing = DOT_BASE_SPACING * camera.scale;
        viewportEl.style.backgroundSize = `${spacing}px ${spacing}px`;
        viewportEl.style.backgroundPosition = `${camera.x}px ${camera.y}px`;
      }

      function cancelCameraAnimation() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
      }

      function animateCameraTo(targetX, targetY, targetScale, duration = 420) {
        cancelCameraAnimation();

        const startX = camera.x;
        const startY = camera.y;
        const startScale = camera.scale;
        const clampedScale = Math.max(getMinScale(), Math.min(MAX_SCALE, targetScale));
        const clampedTarget = clampCameraPosition(targetX, targetY, clampedScale);
        const startTime = performance.now();

        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - t, 3);

          camera.x = startX + (clampedTarget.x - startX) * ease;
          camera.y = startY + (clampedTarget.y - startY) * ease;
          camera.scale = startScale + (clampedScale - startScale) * ease;

          applyCameraTransform();

          if (t < 1) {
            animFrameId = requestAnimationFrame(step);
          } else {
            animFrameId = null;
          }
        }

        animFrameId = requestAnimationFrame(step);
      }

      function zoomAtPoint(newScale, screenX, screenY, animate = false) {
        const clamped = Math.max(getMinScale(), Math.min(MAX_SCALE, newScale));
        const worldX = (screenX - camera.x) / camera.scale;
        const worldY = (screenY - camera.y) / camera.scale;
        const targetX = screenX - worldX * clamped;
        const targetY = screenY - worldY * clamped;

        if (animate) {
          animateCameraTo(targetX, targetY, clamped, 220);
        } else {
          cancelCameraAnimation();
          camera.scale = clamped;
          camera.x = targetX;
          camera.y = targetY;
          applyCameraTransform();
        }
      }

      function resetViewToFitNotes(animate = true) {
        unfocusNote();

        if (notes.length === 0) {
          if (animate) {
            animateCameraTo(window.innerWidth / 2, window.innerHeight / 2, 1.0, 420);
          } else {
            camera.x = window.innerWidth / 2;
            camera.y = window.innerHeight / 2;
            camera.scale = 1.0;
            applyCameraTransform();
          }
          return;
        }

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        notes.forEach((n) => {
          const dims = getNoteDims(n);
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + dims.w);
          maxY = Math.max(maxY, n.y + dims.h);
        });

        const boxW = Math.max(NOTE_SIZE, maxX - minX);
        const boxH = Math.max(NOTE_SIZE, maxY - minY);
        const centerX = minX + (maxX - minX) / 2;
        const centerY = minY + (maxY - minY) / 2;

        // Üst ve alt butonları hesaba katarak tüm notları tek ekrana sığdır
        const topPad = 84;
        const bottomPad = 84;
        const sidePad = window.innerWidth < 640 ? 28 : 64;
        const availW = Math.max(120, window.innerWidth - sidePad * 2);
        const availH = Math.max(120, window.innerHeight - topPad - bottomPad);

        const fitScale = Math.min(availW / boxW, availH / boxH, 1.05);
        const finalScale = Math.max(getMinScale(), Math.min(1.05, fitScale));

        const targetX = window.innerWidth / 2 - centerX * finalScale;
        const targetY = (topPad + availH / 2) - centerY * finalScale;

        if (animate) {
          animateCameraTo(targetX, targetY, finalScale, 440);
        } else {
          cancelCameraAnimation();
          camera.scale = finalScale;
          camera.x = targetX;
          camera.y = targetY;
          applyCameraTransform();
        }
      }

      /* =========================================================
         8. POST-IT OLUŞTURMA, ODAKLAMA, DÜZENLEME VE SİLME
      ========================================================= */
      function clampNoteCoords(x, y, w = NOTE_SIZE, h = NOTE_SIZE) {
        const m = getBoardMetrics();
        const pad = 72;
        const minX = m.minX + pad;
        const maxX = Math.max(minX, m.maxX - pad - w);
        const minY = m.minY + pad;
        const maxY = Math.max(minY, m.maxY - pad - h);
        return {
          x: Math.max(minX, Math.min(maxX, Math.round(x))),
          y: Math.max(minY, Math.min(maxY, Math.round(y)))
        };
      }

      function findNonOverlappingPosition() {
        const centerWorldX = (window.innerWidth / 2 - camera.x) / camera.scale - NOTE_SIZE / 2;
        const centerWorldY = (window.innerHeight / 2 - camera.y) / camera.scale - NOTE_SIZE / 2;
        const minDistance = 185;

        function isCrowded(cx, cy) {
          return notes.some((n) => Math.hypot(n.x - cx, n.y - cy) < minDistance);
        }

        const startPos = clampNoteCoords(centerWorldX, centerWorldY);
        if (!isCrowded(startPos.x, startPos.y)) {
          return startPos;
        }

        for (let step = 1; step <= 48; step++) {
          const angle = step * 0.85;
          const radius = 60 + step * 28;
          const candidate = clampNoteCoords(
            centerWorldX + Math.cos(angle) * radius,
            centerWorldY + Math.sin(angle) * radius
          );
          if (!isCrowded(candidate.x, candidate.y)) {
            return candidate;
          }
        }

        return clampNoteCoords(
          centerWorldX + (Math.random() * 80 - 40),
          centerWorldY + (Math.random() * 80 - 40)
        );
      }

      function renderAllNotes() {
        worldEl.innerHTML = '';
        notes.forEach((note) => {
          worldEl.appendChild(createNoteElement(note, false));
        });
        updateNoteCounter();
      }

      function createNoteElement(note, animatePop = false) {
        const dims = getNoteDims(note);
        const fontSize = clampNumber(note.fontSize || DEFAULT_FONT_SIZE, MIN_FONT_SIZE, MAX_FONT_SIZE);
        note.width = dims.w;
        note.height = dims.h;
        note.fontSize = fontSize;

        const el = document.createElement('article');
        el.className = 'postit' + (animatePop ? ' is-popping' : '');
        el.dataset.id = note.id;
        el.style.left = `${note.x}px`;
        el.style.top = `${note.y}px`;
        el.style.width = `${dims.w}px`;
        el.style.height = `${dims.h}px`;
        el.style.backgroundColor = note.color;
        el.style.zIndex = note.z || 1;
        el.style.setProperty('--note-rot', `${note.rotation}deg`);
        el.style.transform = `rotate(${note.rotation}deg)`;

        // Not Metni
        const textDiv = document.createElement('div');
        textDiv.className = 'postit-text';
        textDiv.style.fontSize = `${fontSize}px`;
        textDiv.textContent = note.text;

        // Alt Aksiyon Çubuğu (Odaklanınca Font Boyutu + Tamamlandı Butonu)
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'postit-actions';

        // Odaklı notta hızlı font boyutu kontrolü
        const fontControls = document.createElement('div');
        fontControls.className = 'postit-font-controls';

        const fontDecBtn = document.createElement('button');
        fontDecBtn.type = 'button';
        fontDecBtn.className = 'postit-font-btn';
        fontDecBtn.textContent = '−';
        fontDecBtn.title = 'Yazıyı küçült';
        fontDecBtn.setAttribute('aria-label', 'Yazıyı küçült');

        const fontValSpan = document.createElement('span');
        fontValSpan.className = 'postit-font-val';
        fontValSpan.textContent = String(fontSize);

        const fontIncBtn = document.createElement('button');
        fontIncBtn.type = 'button';
        fontIncBtn.className = 'postit-font-btn';
        fontIncBtn.textContent = '+';
        fontIncBtn.title = 'Yazıyı büyüt';
        fontIncBtn.setAttribute('aria-label', 'Yazıyı büyüt');

        const updateNoteFont = (delta) => {
          note.fontSize = clampNumber((note.fontSize || DEFAULT_FONT_SIZE) + delta, MIN_FONT_SIZE, MAX_FONT_SIZE);
          textDiv.style.fontSize = `${note.fontSize}px`;
          const activeEdit = el.querySelector('.postit-edit-area');
          if (activeEdit) activeEdit.style.fontSize = `${note.fontSize}px`;
          fontValSpan.textContent = String(note.fontSize);
          saveNotes();
        };

        fontControls.addEventListener('pointerdown', (e) => e.stopPropagation());
        fontDecBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          updateNoteFont(-2);
        });
        fontIncBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          updateNoteFont(2);
        });

        fontControls.appendChild(fontDecBtn);
        fontControls.appendChild(fontValSpan);
        fontControls.appendChild(fontIncBtn);

        const completeBtn = document.createElement('button');
        completeBtn.type = 'button';
        completeBtn.className = 'btn-complete';
        completeBtn.innerHTML = `
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Tamamlandı</span>
        `;

        completeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
        completeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          completeAndDeleteNote(note.id, el);
        });

        actionsDiv.appendChild(fontControls);
        actionsDiv.appendChild(completeBtn);

        // Sağ Alt Köşe Boyutlandırma Tutamacı
        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'postit-resize-handle';
        resizeHandle.title = 'Köşeden çekerek boyutlandır';
        resizeHandle.setAttribute('aria-label', 'Kağıdı boyutlandır');
        resizeHandle.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="11" y1="4" x2="4" y2="11" />
            <line x1="11" y1="8.2" x2="8.2" y2="11" />
          </svg>
        `;
        attachNoteResizeHandler(resizeHandle, el, note);

        el.appendChild(textDiv);
        el.appendChild(actionsDiv);
        el.appendChild(resizeHandle);

        // Odaklı notun metnine tıklandığında doğrudan düzenleme
        textDiv.addEventListener('click', (e) => {
          if (focusedNoteId === note.id) {
            e.stopPropagation();
            enableInlineEdit(note, el, textDiv);
          }
        });

        attachNoteDragAndTapHandlers(el, note);
        return el;
      }

      function attachNoteResizeHandler(handle, el, note) {
        let isResizing = false;
        let activePointerId = null;
        let startClientX = 0;
        let startClientY = 0;
        let startW = NOTE_SIZE;
        let startH = NOTE_SIZE;

        handle.addEventListener('pointerdown', (e) => {
          if (activeTouches.size > 1) return;
          if (e.button !== 0 && e.pointerType === 'mouse') return;

          e.stopPropagation();
          e.preventDefault();
          cancelCameraAnimation();

          isResizing = true;
          activePointerId = e.pointerId;
          startClientX = e.clientX;
          startClientY = e.clientY;
          const dims = getNoteDims(note);
          startW = dims.w;
          startH = dims.h;

          highestZIndex += 1;
          note.z = highestZIndex;
          el.style.zIndex = note.z;
          el.classList.add('is-resizing');

          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (!isResizing || e.pointerId !== activePointerId) return;

          const dx = (e.clientX - startClientX) / camera.scale;
          const dy = (e.clientY - startClientY) / camera.scale;

          const m = getBoardMetrics();
          const maxAllowedW = Math.min(MAX_NOTE_SIZE, m.maxX - 40 - note.x);
          const maxAllowedH = Math.min(MAX_NOTE_SIZE, m.maxY - 40 - note.y);

          note.width = Math.round(clampNumber(startW + dx, MIN_NOTE_SIZE, Math.max(MIN_NOTE_SIZE, maxAllowedW)));
          note.height = Math.round(clampNumber(startH + dy, MIN_NOTE_SIZE, Math.max(MIN_NOTE_SIZE, maxAllowedH)));

          el.style.width = `${note.width}px`;
          el.style.height = `${note.height}px`;
        });

        const endResize = (e) => {
          if (!isResizing || e.pointerId !== activePointerId) return;
          isResizing = false;
          el.classList.remove('is-resizing');

          try {
            if (handle.hasPointerCapture(e.pointerId)) {
              handle.releasePointerCapture(e.pointerId);
            }
          } catch (_) {}

          saveNotes();
        };

        handle.addEventListener('pointerup', endResize);
        handle.addEventListener('pointercancel', endResize);
      }

      function enableInlineEdit(note, noteEl, textDiv) {
        if (noteEl.querySelector('.postit-edit-area')) return;

        const textarea = document.createElement('textarea');
        textarea.className = 'postit-edit-area';
        textarea.style.fontSize = `${note.fontSize || DEFAULT_FONT_SIZE}px`;
        textarea.value = note.text;
        textarea.maxLength = 400;

        textDiv.style.display = 'none';
        noteEl.insertBefore(textarea, textDiv);
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);

        const saveInline = () => {
          const updated = textarea.value.trim();
          if (updated.length > 0) {
            note.text = updated;
            textDiv.textContent = updated;
            saveNotes();
          }
        };

        textarea.addEventListener('input', saveInline);
        textarea.addEventListener('pointerdown', (e) => e.stopPropagation());
        textarea.addEventListener('blur', () => {
          saveInline();
          textarea.remove();
          textDiv.style.display = '';
        });
        textarea.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
            textarea.blur();
          }
        });
      }

      function focusNote(noteId) {
        const note = notes.find((n) => n.id === noteId);
        if (!note) return;

        if (focusedNoteId && focusedNoteId !== noteId) {
          const prevEl = worldEl.querySelector(`.postit[data-id="${focusedNoteId}"]`);
          if (prevEl) prevEl.classList.remove('is-focused');
        }

        focusedNoteId = noteId;
        highestZIndex += 1;
        note.z = highestZIndex;
        saveNotes();

        const el = worldEl.querySelector(`.postit[data-id="${noteId}"]`);
        if (el) {
          el.style.zIndex = note.z;
          el.classList.add('is-focused');
        }

        const dims = getNoteDims(note);
        const maxFitScale = Math.min(
          (window.innerWidth - 56) / dims.w,
          (window.innerHeight - 150) / dims.h
        );
        const targetScale = clampNumber(
          Math.min(window.innerWidth < 640 ? 1.3 : 1.35, maxFitScale),
          getMinScale(),
          MAX_SCALE
        );

        const noteCenterX = note.x + dims.w / 2;
        const noteCenterY = note.y + dims.h / 2;

        const targetX = window.innerWidth / 2 - noteCenterX * targetScale;
        const targetY = window.innerHeight / 2 - noteCenterY * targetScale;

        animateCameraTo(targetX, targetY, targetScale, 420);
      }

      function unfocusNote() {
        if (!focusedNoteId) return;
        const el = worldEl.querySelector(`.postit[data-id="${focusedNoteId}"]`);
        if (el) {
          const activeEditor = el.querySelector('.postit-edit-area');
          if (activeEditor) activeEditor.blur();
          el.classList.remove('is-focused');
        }
        focusedNoteId = null;
      }

      function completeAndDeleteNote(noteId, noteEl, customMessage = 'Tamamlandı! Not panodan silindi.') {
        if (focusedNoteId === noteId) {
          focusedNoteId = null;
        }

        noteEl.classList.remove('is-focused');
        noteEl.classList.add('is-peeling');

        notes = notes.filter((n) => n.id !== noteId);
        saveNotes();

        setTimeout(() => {
          noteEl.remove();
        }, 400);

        showToast(customMessage, 2200);
      }

      /* =========================================================
         9. NOT SÜRÜKLE-BIRAK VE TIKLAMA AYRIMI
      ========================================================= */
      function attachNoteDragAndTapHandlers(el, note) {
        let isPointerDown = false;
        let hasDragged = false;
        let startClientX = 0;
        let startClientY = 0;
        let startNoteX = 0;
        let startNoteY = 0;
        let activePointerId = null;

        el.addEventListener('pointerdown', (e) => {
          if (activeTouches.size > 1) return;
          if (
            e.target.closest('.btn-complete') ||
            e.target.closest('.postit-edit-area') ||
            e.target.closest('.postit-resize-handle') ||
            e.target.closest('.postit-font-controls')
          ) return;
          if (e.button !== 0 && e.pointerType === 'mouse') return;

          e.stopPropagation();
          cancelCameraAnimation();

          isPointerDown = true;
          hasDragged = false;
          activePointerId = e.pointerId;
          startClientX = e.clientX;
          startClientY = e.clientY;
          startNoteX = note.x;
          startNoteY = note.y;

          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener('pointermove', (e) => {
          if (!isPointerDown || e.pointerId !== activePointerId) return;
          if (activeTouches.size > 1) {
            isPointerDown = false;
            el.classList.remove('is-dragging');
            return;
          }

          const dx = e.clientX - startClientX;
          const dy = e.clientY - startClientY;

          if (!hasDragged && Math.hypot(dx, dy) > 6) {
            hasDragged = true;
            el.classList.add('is-dragging');
            highestZIndex += 1;
            note.z = highestZIndex;
            el.style.zIndex = note.z;
          }

          if (hasDragged) {
            const dims = getNoteDims(note);
            const clampedPos = clampNoteCoords(
              startNoteX + dx / camera.scale,
              startNoteY + dy / camera.scale,
              dims.w,
              dims.h
            );
            note.x = clampedPos.x;
            note.y = clampedPos.y;
            el.style.left = `${note.x}px`;
            el.style.top = `${note.y}px`;
          }
        });

        const endDrag = (e) => {
          if (!isPointerDown || e.pointerId !== activePointerId) return;
          isPointerDown = false;
          el.classList.remove('is-dragging');

          try {
            if (el.hasPointerCapture(e.pointerId)) {
              el.releasePointerCapture(e.pointerId);
            }
          } catch (_) {}

          if (hasDragged) {
            saveNotes();
          } else {
            if (focusedNoteId !== note.id) {
              focusNote(note.id);
            }
          }
        };

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);
      }

      /* =========================================================
         10. PANO SÜRÜKLEME (PAN) VE YAKINLAŞTIRMA (WHEEL + PINCH)
      ========================================================= */
      let isPanning = false;
      let panStartX = 0;
      let panStartY = 0;
      let panCameraStartX = 0;
      let panCameraStartY = 0;
      let panMoved = false;

      const activeTouches = new Map();
      let initialPinchDist = 0;
      let initialPinchScale = 1;
      let lastPinchMidX = 0;
      let lastPinchMidY = 0;

      viewportEl.addEventListener('pointerdown', (e) => {
        if (e.target !== viewportEl && e.target !== worldEl) return;
        if (e.button !== 0 && e.pointerType === 'mouse') return;

        cancelCameraAnimation();

        if (e.pointerType === 'touch') {
          activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (activeTouches.size === 2) {
            isPanning = false;
            viewportEl.classList.remove('is-panning');
            startPinch();
            return;
          }
        }

        isPanning = true;
        panMoved = false;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panCameraStartX = camera.x;
        panCameraStartY = camera.y;
        viewportEl.classList.add('is-panning');
      });

      window.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch' && activeTouches.has(e.pointerId)) {
          activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (activeTouches.size === 2) {
            handlePinchMove();
            return;
          }
        }

        if (!isPanning) return;

        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;

        if (Math.hypot(dx, dy) > 4) {
          panMoved = true;
        }

        camera.x = panCameraStartX + dx;
        camera.y = panCameraStartY + dy;
        applyCameraTransform();
      });

      const endPan = (e) => {
        if (e.pointerType === 'touch') {
          activeTouches.delete(e.pointerId);
          if (activeTouches.size < 2) {
            initialPinchDist = 0;
          }
        }

        if (isPanning) {
          isPanning = false;
          viewportEl.classList.remove('is-panning');
          if (!panMoved) {
            unfocusNote();
          }
        }
      };

      window.addEventListener('pointerup', endPan);
      window.addEventListener('pointercancel', endPan);

      // Dokunmatik iki parmak pinch-to-zoom
      viewportEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          cancelCameraAnimation();
          isPanning = false;
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          initialPinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          initialPinchScale = camera.scale;
          lastPinchMidX = (t1.clientX + t2.clientX) / 2;
          lastPinchMidY = (t1.clientY + t2.clientY) / 2;
        }
      }, { passive: false });

      viewportEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist > 0) {
          e.preventDefault();
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          const midX = (t1.clientX + t2.clientX) / 2;
          const midY = (t1.clientY + t2.clientY) / 2;

          camera.x += (midX - lastPinchMidX);
          camera.y += (midY - lastPinchMidY);
          lastPinchMidX = midX;
          lastPinchMidY = midY;

          const newScale = initialPinchScale * (dist / initialPinchDist);
          zoomAtPoint(newScale, midX, midY, false);
        }
      }, { passive: false });

      viewportEl.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDist = 0;
        }
      });

      function startPinch() {
        const pts = Array.from(activeTouches.values());
        initialPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        initialPinchScale = camera.scale;
        lastPinchMidX = (pts[0].x + pts[1].x) / 2;
        lastPinchMidY = (pts[0].y + pts[1].y) / 2;
      }

      function handlePinchMove() {
        if (initialPinchDist <= 0) return;
        const pts = Array.from(activeTouches.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const midX = (pts[0].x + pts[1].x) / 2;
        const midY = (pts[0].y + pts[1].y) / 2;

        camera.x += (midX - lastPinchMidX);
        camera.y += (midY - lastPinchMidY);
        lastPinchMidX = midX;
        lastPinchMidY = midY;

        zoomAtPoint(initialPinchScale * (dist / initialPinchDist), midX, midY, false);
      }

      // Fare tekerleği ile yakınlaştırma/uzaklaştırma
      viewportEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        zoomAtPoint(camera.scale * zoomFactor, e.clientX, e.clientY, false);
      }, { passive: false });

      // Sağ alt Zoom butonları
      btnZoomIn.addEventListener('click', () => {
        zoomAtPoint(camera.scale * 1.22, window.innerWidth / 2, window.innerHeight / 2, true);
      });

      btnZoomOut.addEventListener('click', () => {
        zoomAtPoint(camera.scale * 0.82, window.innerWidth / 2, window.innerHeight / 2, true);
      });

      btnResetView.addEventListener('click', () => {
        resetViewToFitNotes(true);
      });

      /* =========================================================
         11. YENİ NOT EKLEME MODALI VE 16 RENKLİ SEÇİCİ
      ========================================================= */
      function buildColorPicker() {
        colorPickerEl.innerHTML = '';
        POSTIT_COLORS.forEach((color) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'color-swatch' + (color.hex === selectedColor ? ' is-selected' : '');
          btn.style.backgroundColor = color.hex;
          btn.title = color.name;
          btn.setAttribute('aria-label', color.name);
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-checked', String(color.hex === selectedColor));

          btn.addEventListener('click', () => {
            selectedColor = color.hex;
            localStorage.setItem(STORAGE_KEYS.LAST_COLOR, color.hex);
            modalCard.style.backgroundColor = color.hex;
            colorPickerEl.querySelectorAll('.color-swatch').forEach((sw) => {
              const isSelected = sw === btn;
              sw.classList.toggle('is-selected', isSelected);
              sw.setAttribute('aria-checked', String(isSelected));
            });
          });

          colorPickerEl.appendChild(btn);
        });
      }

      function syncModalFontSize(val) {
        const clamped = clampNumber(parseInt(val, 10) || DEFAULT_FONT_SIZE, MIN_FONT_SIZE, MAX_FONT_SIZE);
        selectedFontSize = clamped;
        localStorage.setItem(STORAGE_KEYS.LAST_FONT_SIZE, String(clamped));
        newNoteFontSizeInput.value = String(clamped);
        newNoteInput.style.fontSize = `${clamped}px`;
      }

      btnFontDec.addEventListener('click', () => syncModalFontSize(selectedFontSize - 2));
      btnFontInc.addEventListener('click', () => syncModalFontSize(selectedFontSize + 2));
      newNoteFontSizeInput.addEventListener('input', () => {
        const parsed = parseInt(newNoteFontSizeInput.value, 10);
        if (Number.isFinite(parsed) && parsed >= MIN_FONT_SIZE && parsed <= MAX_FONT_SIZE) {
          selectedFontSize = parsed;
          localStorage.setItem(STORAGE_KEYS.LAST_FONT_SIZE, String(parsed));
          newNoteInput.style.fontSize = `${parsed}px`;
        }
      });
      newNoteFontSizeInput.addEventListener('blur', () => syncModalFontSize(newNoteFontSizeInput.value));

      function openAddModal() {
        unfocusNote();
        modalCard.style.backgroundColor = selectedColor;
        newNoteInput.value = '';
        syncModalFontSize(selectedFontSize);
        addModal.classList.remove('hidden');
        addModal.classList.add('flex');
        setTimeout(() => newNoteInput.focus(), 60);
      }

      function closeAddModal() {
        addModal.classList.add('hidden');
        addModal.classList.remove('flex');
      }

      function handleSaveNewNote() {
        const text = newNoteInput.value.trim();
        if (!text) {
          showToast('Önce aklına geleni yaz!', 2000);
          newNoteInput.focus();
          return;
        }

        const fontSize = clampNumber(parseInt(newNoteFontSizeInput.value, 10) || selectedFontSize, MIN_FONT_SIZE, MAX_FONT_SIZE);
        const pos = findNonOverlappingPosition();
        highestZIndex += 1;

        const newNote = {
          id: createId(),
          text,
          color: selectedColor,
          x: pos.x,
          y: pos.y,
          width: NOTE_SIZE,
          height: NOTE_SIZE,
          fontSize,
          rotation: randomRotation(),
          z: highestZIndex,
          createdAt: Date.now()
        };

        notes.push(newNote);
        saveNotes();

        const el = createNoteElement(newNote, true);
        worldEl.appendChild(el);
        closeAddModal();

        const screenX = newNote.x * camera.scale + camera.x;
        const screenY = newNote.y * camera.scale + camera.y;
        const margin = 40;
        if (
          screenX < margin ||
          screenY < margin ||
          screenX + NOTE_SIZE * camera.scale > window.innerWidth - margin ||
          screenY + NOTE_SIZE * camera.scale > window.innerHeight - margin
        ) {
          const targetX = window.innerWidth / 2 - (newNote.x + NOTE_SIZE / 2) * camera.scale;
          const targetY = window.innerHeight / 2 - (newNote.y + NOTE_SIZE / 2) * camera.scale;
          animateCameraTo(targetX, targetY, camera.scale, 380);
        }
      }

      btnAddNote.addEventListener('click', openAddModal);
      btnCloseModal.addEventListener('click', closeAddModal);
      btnSaveNote.addEventListener('click', handleSaveNewNote);

      addModal.addEventListener('click', (e) => {
        if (e.target === addModal) closeAddModal();
      });

      newNoteInput.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          handleSaveNewNote();
        } else if (e.key === 'Escape') {
          closeAddModal();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!addModal.classList.contains('hidden')) {
            closeAddModal();
          } else {
            unfocusNote();
          }
        }
      });

      /* =========================================================
         12. SAATLİK BİLDİRİM SİSTEMİ (:00)
      ========================================================= */
      function getCurrentHourKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        return `${y}-${m}-${d}-${h}`;
      }

      function getNextHourLabel() {
        const next = new Date();
        next.setHours(next.getHours() + 1, 0, 0, 0);
        return `${String(next.getHours()).padStart(2, '0')}:00`;
      }

      function updateBellUI() {
        if (hourlyEnabled) {
          bellDot.classList.remove('hidden');
          btnBell.style.borderColor = 'rgba(246, 169, 122, 0.85)';
          btnBell.style.color = isDarkMode ? '#FFFFFF' : '#23201C';
          btnBell.setAttribute('aria-pressed', 'true');
        } else {
          bellDot.classList.add('hidden');
          btnBell.style.borderColor = '';
          btnBell.style.color = '';
          btnBell.setAttribute('aria-pressed', 'false');
        }
      }

      function triggerHourlyReminder() {
        const count = notes.length;
        const body = count > 0
          ? `Panonda ${count} not bekliyor. Bir göz atmak ister misin?`
          : 'Aklına gelen bir şey var mı? Yeni bir not yapıştırabilirsin.';

        showToast(body, 4500);

        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification('Notepad', {
              body,
              icon: appIconDataUrl || undefined,
              badge: appIconDataUrl || undefined,
              tag: 'notepad-hourly'
            });
          } catch (err) {
            console.warn('Tarayıcı bildirimi gönderilemedi:', err);
          }
        }
      }

      function checkHourlyTrigger() {
        if (!hourlyEnabled) return;
        const currentKey = getCurrentHourKey();
        const lastKey = localStorage.getItem(STORAGE_KEYS.LAST_NOTIFIED_HOUR);

        if (lastKey && lastKey !== currentKey) {
          localStorage.setItem(STORAGE_KEYS.LAST_NOTIFIED_HOUR, currentKey);
          triggerHourlyReminder();
        } else if (!lastKey) {
          localStorage.setItem(STORAGE_KEYS.LAST_NOTIFIED_HOUR, currentKey);
        }
      }

      async function toggleHourlyNotifications() {
        if (hourlyEnabled) {
          hourlyEnabled = false;
          localStorage.setItem(STORAGE_KEYS.HOURLY_ENABLED, 'false');
          updateBellUI();
          showToast('Saatlik bildirim kapatıldı', 2400);
          return;
        }

        hourlyEnabled = true;
        localStorage.setItem(STORAGE_KEYS.HOURLY_ENABLED, 'true');
        localStorage.setItem(STORAGE_KEYS.LAST_NOTIFIED_HOUR, getCurrentHourKey());
        updateBellUI();

        const nextLabel = getNextHourLabel();

        if (!('Notification' in window)) {
          showToast(`Uygulama içi hatırlatıcı açık · Sonraki: ${nextLabel}`, 3400);
          return;
        }

        if (Notification.permission === 'granted') {
          showToast(`Saatlik bildirim açıldı · Sonraki: ${nextLabel}`, 3400);
        } else if (Notification.permission === 'denied') {
          showToast(`Tarayıcı izni kapalı · Uygulama içi hatırlatıcı açık (${nextLabel})`, 3800);
        } else {
          try {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
              showToast(`Saatlik bildirim açıldı · Sonraki: ${nextLabel}`, 3400);
            } else {
              showToast(`İzin verilmedi · Uygulama içi hatırlatıcı açık (${nextLabel})`, 3600);
            }
          } catch (_) {
            showToast(`Saatlik hatırlatıcı açık · Sonraki: ${nextLabel}`, 3400);
          }
        }
      }

      btnBell.addEventListener('click', toggleHourlyNotifications);

      setInterval(checkHourlyTrigger, 30000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkHourlyTrigger();
        }
      });

      /* =========================================================
         13. BAŞLATMA (INIT)
      ========================================================= */
      function init() {
        setupPwaAssets();
        applyTheme(isDarkMode);
        buildColorPicker();
        loadNotes();
        renderAllNotes();
        updateBellUI();
        resetViewToFitNotes(false);
      }

      window.addEventListener('resize', applyCameraTransform);

      init();
    })();
  </script>
</body>
</html>
